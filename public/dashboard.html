<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | CipherPath</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="dashboard">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><span class="logo__mark" aria-hidden="true">&gt;_</span>CipherPath</a>
      <nav class="auth-nav" aria-label="Account">
        <a href="/dashboard.html" aria-current="page">Dashboard</a>
        <a href="/settings.html">Settings</a>
        <button class="btn btn--ghost btn--sm" type="button" data-logout>Log out</button>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="container">
      <div class="page__head">
        <h1>Welcome back, <span data-username></span></h1>
        <p>Your progress is saved to your account.</p>
      </div>
      <p class="sample-note" id="dash-status" role="status" aria-live="polite"></p>
      <ul class="path-grid" id="dash-paths"></ul>
    </div>
  </main>
</body>
</html>
