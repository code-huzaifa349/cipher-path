<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | CipherPath</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><span class="logo__mark" aria-hidden="true">&gt;_</span>CipherPath</a>
      <nav class="auth-nav" aria-label="Account"><a href="/signup.html" class="btn btn--primary btn--sm">Sign up</a></nav>
    </div>
  </header>
  <main class="auth">
    <div class="auth__card">
      <h1>Log in</h1>
      <p class="auth__sub">Welcome back. Pick up where you left off.</p>
      <form class="auth-form" id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="form-status" role="alert"></p>
        <button class="btn btn--primary" type="submit">Log in</button>
      </form>
      <p class="auth__alt">New here? <a href="/signup.html">Create an account</a></p>
    </div>
  </main>
</body>
</html>
